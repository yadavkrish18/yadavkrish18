name: Update README stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update stats in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          USER = "yadavkrish18"
          H = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "readme-updater",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
          }

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=H)) as r:
                  return json.load(r)

          user = get(f"https://api.github.com/users/{USER}")
          stars, page = 0, 1
          while True:
              repos = get(f"https://api.github.com/users/{USER}/repos?per_page=100&page={page}")
              if not repos:
                  break
              stars += sum(r["stargazers_count"] for r in repos)
              page += 1

          text = open("README.md", encoding="utf-8").read()
          text = re.sub(r"(Repositories: )\S+", lambda m: m.group(1) + str(user["public_repos"]), text)
          text = re.sub(r"(Stars: )\S+", lambda m: m.group(1) + str(stars), text)
          text = re.sub(r"(Followers: )\S+", lambda m: m.group(1) + str(user["followers"]), text)
          open("README.md", "w", encoding="utf-8").write(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || (git commit -m "Update stats" && git push)
